<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎱 Snooker Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
    }

    canvas {
      background: url('/game/table.png') no-repeat center center;
      background-size: cover;
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 20px green;
    }

    #info {
      color: #00ff88;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎱 Snooker Game</h1>
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div id="info">Your turn - Drag to shoot</div>

  <script src="engine.js"></script>
</body>
</html>
