<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-3xl font-bold mb-6">📝 Register</h1>
  <form class="flex flex-col w-80 gap-4 bg-gray-800 p-6 rounded-lg shadow-lg">
    <input type="text" name="username" placeholder="Username" class="p-2 rounded bg-gray-700 text-white" required />
    <input type="email" name="email" placeholder="Email" class="p-2 rounded bg-gray-700 text-white" required />
    <input type="password" name="password" placeholder="Password" class="p-2 rounded bg-gray-700 text-white" required />
    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
      Register
    </button>
    <p class="text-center text-sm">Already have an account? <a href="login.html" class="text-blue-400 underline">Login</a></p>
  </form>

  <script>
    document.querySelector("form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(this);
      const data = {
        username: formData.get("username"),
        email: formData.get("email"),
        password: formData.get("password"),
      };

      const res = await fetch("http://localhost:3000/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      const result = await res.json();
      if (res.ok) {
        alert(result.message);
        window.location.href = "login.html";
      } else {
        alert("❌ " + result.message);
      }
    });
  </script>
</body>
</html>
