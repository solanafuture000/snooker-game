<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Snooker Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-gray-800 p-6 rounded-xl w-full max-w-md shadow-lg">
    <h1 class="text-2xl font-bold text-center mb-4">🎱 Welcome, <span id="username"></span>!</h1>

    <div class="bg-gray-700 rounded p-4 mb-4">
      <p><strong>💰 Chips:</strong> <span id="chips">Loading...</span></p>
      <p><strong>🔗 Wallet Address:</strong></p>
      <p class="text-xs text-green-400" id="wallet">Loading...</p>
    </div>

    <div class="flex flex-col gap-2">
      <a href="withdraw.html" class="bg-yellow-500 hover:bg-yellow-600 text-center text-white py-2 rounded">Withdraw</a>
      <a href="referrals.html" class="bg-blue-500 hover:bg-blue-600 text-center text-white py-2 rounded">Referral Stats</a>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 py-2 text-white rounded">Logout</button>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
